<!doctype html>
<html lang="es">

<meta name="description" content="Un cumpleaños, muchos recuerdos y un deseo por pedir. Toca el pastel para apagar la vela.">
<title>Pide un deseo · Feliz cumpleaños</title>

      </button>
      <p class="instruction" id="instruction"><span class="desktop-instruction">Haz clic en la vela para apagarla</span><span class="touch-instruction">Toca la vela para apagarla</span></p>
      <p class="success-message" id="success-message" role="status" aria-live="polite"></p>
      <button class="relight" id="relight" type="button" hidden>Volver a encender</button>
    </div>
    <div class="photo-fan fan-right" id="fan-right"></div>
  </div>
  <a class="album-link" href="#album">Nuestros recuerdos <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16m-6-6 6 6 6-6"/></svg></a>
</section>
<section class="album" id="album" aria-labelledby="album-title">
  <div class="album-heading"><span class="tiny-flower" aria-hidden="true">✳</span><h2 id="album-title">Todos estos momentos</h2><p>Y los que faltan por vivir.</p></div>
  <div class="gallery" id="gallery"></div>
  <noscript><p>Activa JavaScript para ver las fotos y apagar la vela.</p></noscript>
</section>
<footer>Que nunca falten motivos para sonreír.<span aria-hidden="true">♡</span></footer>
</main>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<dialog id="lightbox" aria-label="Visor de fotos">

</dialog>
